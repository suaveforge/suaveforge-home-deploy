<!doctype html>
<html lang="ko">
<head>

<meta name="robots" content="noindex,nofollow,noarchive">
<title>SuaveForge Offer Lab | 계약 혜택 테스트</title>
<style>

</style>

<body>
<div class="preview-status" id="preview-status">Loading SuaveForge preview…</div>
<iframe id="preview" title="SuaveForge 계약 혜택 테스트" src="/?offer-lab-preview=4"></iframe>
<script>
(()=>{
  const frame=document.getElementById('preview');
  const status=document.getElementById('preview-status');
  frame.addEventListener('load',()=>{
    try{
      const d=frame.contentDocument;
      if(!d) throw new Error('same-origin document unavailable');
      if(d.getElementById('offerlab-benefits')){status.classList.add('is-hidden');return;}

      const style=d.createElement('style');
      style.id='offerlab-preview-style';
      style.textContent=`
      .offerlab-section{position:relative;overflow:hidden;padding:132px 0 0;background:#f5f2ec;border-top:1px solid #cfcac2;border-bottom:1px solid #cfcac2;color:#111318}
      .offerlab-section:before{content:"";position:absolute;inset:0 0 auto;height:700px;pointer-events:none;opacity:.28;background-image:linear-gradient(rgba(17,19,24,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(17,19,24,.045) 1px,transparent 1px);background-size:72px 72px;mask-image:linear-gradient(to bottom,black,transparent 92%)}
      .offerlab-inner{position:relative;z-index:1}
      .offerlab-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,.38fr);align-items:end;gap:72px;margin-bottom:74px}
      .offerlab-kicker{margin:0 0 20px;color:#c52621;font-size:11px;font-weight:950;letter-spacing:.17em;text-transform:uppercase}
      .offerlab-head h2{max-width:930px;margin:0;color:#111318;font-size:clamp(46px,5.5vw,82px);font-weight:950;line-height:1.02;letter-spacing:-.065em}
      .offerlab-head h2 em{position:relative;font-style:normal;z-index:0}.offerlab-head h2 em:after{content:"";position:absolute;z-index:-1;left:-.03em;right:-.05em;bottom:.05em;height:.23em;background:#ffd84d;transform:rotate(-1.1deg)}
      .offerlab-head>p{margin:0 0 8px;color:#666b75;font-size:15px;line-height:1.82}

      .offerlab-proof-strip{display:grid;grid-template-columns:repeat(4,1fr);margin:-22px 0 52px;border-top:1px solid #aaa69f;border-bottom:1px solid #aaa69f;background:rgba(255,255,255,.22)}.offerlab-proof-strip>div{padding:19px 22px;border-right:1px solid #d0cbc3}.offerlab-proof-strip>div:last-child{border-right:0}.offerlab-proof-strip strong{display:block;color:#111318;font-size:20px;line-height:1;font-weight:950;letter-spacing:-.04em}.offerlab-proof-strip span{display:block;margin-top:8px;color:#6d7178;font-size:9px;font-weight:850;letter-spacing:.04em}
      .offerlab-light{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #aaa69f;border-bottom:1px solid #aaa69f;margin-bottom:72px}
      .offerlab-lite{display:grid;grid-template-columns:112px 1fr;gap:18px;min-height:214px;padding:38px 40px 38px 0;align-items:start}
      .offerlab-lite+.offerlab-lite{border-left:1px solid #aaa69f;padding-left:40px}
      .offerlab-lite-no{font-size:64px;font-weight:950;line-height:.86;letter-spacing:-.07em;color:#c52621}
      .offerlab-lite-copy small{display:block;margin:1px 0 15px;color:#777b83;font-size:9px;font-weight:950;letter-spacing:.15em;text-transform:uppercase}
      .offerlab-lite-copy h3{margin:0;font-size:clamp(27px,2.4vw,38px);line-height:1.08;letter-spacing:-.052em}
      .offerlab-lite-copy p{max-width:500px;margin:18px 0 0;color:#61666e;font-size:13px;line-height:1.75}
      .offerlab-mini-track{display:flex;align-items:center;gap:7px;margin-top:25px;color:#676c74;font-size:9px;font-weight:900;letter-spacing:.02em}.offerlab-mini-track i{display:block;width:5px;height:5px;border-radius:50%;background:#c52621}.offerlab-mini-track b{display:block;width:30px;height:1px;background:#b8b3aa}
      .offerlab-care-pill{display:inline-flex;align-items:center;gap:10px;margin-top:24px;padding:9px 12px;border:1px solid #c8c3bb;background:rgba(255,255,255,.45);font-size:10px;font-weight:900}.offerlab-care-pill strong{color:#c52621}

      .offerlab-forge{position:relative;overflow:hidden;background:#111318;color:#fff;margin:0 calc(var(--pad) * -1);padding:84px var(--pad) 88px}
      .offerlab-forge:before{content:"03";position:absolute;right:-.03em;top:-.22em;color:rgba(255,255,255,.035);font-size:min(34vw,520px);font-weight:950;line-height:1;letter-spacing:-.1em;pointer-events:none}
      .offerlab-forge-grid{position:relative;z-index:1;display:grid;grid-template-columns:.86fr 1.14fr;gap:76px;align-items:center}
      .forge-kicker{display:flex;align-items:center;gap:12px;margin-bottom:23px;color:#ff7771;font-size:10px;font-weight:950;letter-spacing:.16em;text-transform:uppercase}.forge-kicker:before{content:"";width:34px;height:2px;background:#c52621}
      .forge-copy-block h3{margin:0;color:#fff;font-size:clamp(48px,5.2vw,78px);line-height:.94;letter-spacing:-.067em}.forge-copy-block h3 span{display:block;margin-top:13px;color:#ffd84d;font-size:.47em;line-height:1.06;letter-spacing:-.045em}
      .forge-copy-block>p{max-width:540px;margin:27px 0 0;color:#b8bdc7;font-size:14px;line-height:1.84}
      .forge-promise{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:37px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.16)}
      .forge-promise div{background:#111318;padding:18px 19px}.forge-promise strong{display:block;color:#fff;font-size:28px;line-height:1;letter-spacing:-.045em}.forge-promise span{display:block;margin-top:8px;color:#979ca7;font-size:8px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
      .forge-idea-line{margin-top:28px;padding-left:18px;border-left:2px solid #c52621;color:#fff;font-size:12px;font-weight:850;line-height:1.7}
      .forge-idea-line em{color:#ffd84d;font-style:normal}

      .forge-demo-wrap{position:relative}.forge-demo-note{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:#8f949e;font-size:8px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.forge-demo-note b{color:#ffd84d;font-weight:950}
      .forge-controls input{position:absolute;opacity:0;pointer-events:none}.forge-labels{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}.forge-labels label{cursor:pointer;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:8px 12px;color:#b9bdc5;font-size:10px;font-weight:900;transition:.2s}.forge-labels label:hover{border-color:#fff;color:#fff}
      #forge-original:checked~.forge-labels label[for=forge-original],#forge-warm:checked~.forge-labels label[for=forge-warm],#forge-focus:checked~.forge-labels label[for=forge-focus],#forge-compact:checked~.forge-labels label[for=forge-compact]{background:#c52621;border-color:#c52621;color:#fff}
      .forge-stage{border:1px solid rgba(255,255,255,.24);background:#f7f4ee;color:#111318;box-shadow:0 30px 80px rgba(0,0,0,.34);transition:.3s}
      .forge-browser{display:flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-bottom:1px solid #d9d4cb;background:#ebe7df}.forge-browser i{width:7px;height:7px;border-radius:50%;background:#aaa}.forge-browser b{margin-left:auto;color:#777;font-size:8px;letter-spacing:.08em}
      .forge-preview{display:grid;grid-template-columns:1.02fr .98fr;min-height:350px;padding:30px;gap:28px;transition:.3s}.forge-screen-copy{align-self:center}.forge-screen-copy span{display:block;margin-bottom:11px;color:#c52621;font-size:9px;font-weight:950;letter-spacing:.14em}.forge-screen-copy strong{display:block;max-width:320px;font-size:clamp(27px,2.5vw,39px);line-height:1.01;letter-spacing:-.058em}.forge-screen-copy p{width:79%;height:6px;margin:22px 0 0;background:#c8c4bc;box-shadow:0 12px 0 #ddd8d0,0 24px 0 #ddd8d0}.forge-screen-copy b{display:inline-block;margin-top:48px;padding:10px 13px;background:#111318;color:#fff;font-size:9px;font-weight:950}
      .forge-art{min-height:285px;background:linear-gradient(140deg,#22252b 0 46%,#c52621 46% 50%,#d8d2c8 50%);transition:.3s}.forge-demo-caption{margin:13px 0 0;color:#9297a2;font-size:10px;line-height:1.6}
      #forge-warm:checked~.forge-stage .forge-preview{background:#f3e6d6}#forge-warm:checked~.forge-stage .forge-art{background:linear-gradient(135deg,#6f2c22,#e0a55d 55%,#f3dfb7)}
      #forge-focus:checked~.forge-stage .forge-preview{grid-template-columns:.72fr 1.28fr}#forge-focus:checked~.forge-stage .forge-art{background:linear-gradient(145deg,#111318 0 52%,#ffd84d 52% 57%,#c52621 57%)}#forge-focus:checked~.forge-stage .forge-screen-copy strong{font-size:28px}
      #forge-compact:checked~.forge-stage .forge-preview{grid-template-columns:1fr;min-height:350px}#forge-compact:checked~.forge-stage .forge-art{min-height:125px;order:-1;background:linear-gradient(90deg,#111318,#454b56)}#forge-compact:checked~.forge-stage .forge-screen-copy{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}#forge-compact:checked~.forge-stage .forge-screen-copy p{display:none}#forge-compact:checked~.forge-stage .forge-screen-copy b{margin-top:0;justify-self:end}

      .offerlab-total{position:relative;padding:78px 0 92px;background:#f5f2ec}
      .offerlab-total-top{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;margin-bottom:40px}
      .offerlab-total-top span{color:#c52621;font-size:10px;font-weight:950;letter-spacing:.17em;text-transform:uppercase}.offerlab-total-top h3{max-width:900px;margin:0;font-size:clamp(38px,4.8vw,68px);line-height:1.02;letter-spacing:-.062em}.offerlab-total-top h3 em{font-style:normal;color:#c52621}
      .offerlab-equation{display:grid;grid-template-columns:1fr auto 1fr auto 1.28fr auto;align-items:stretch;border-top:1px solid #aaa69f;border-bottom:1px solid #aaa69f}.offerlab-equation article{padding:30px 22px}.offerlab-equation article:first-child{padding-left:0}.offerlab-equation small{display:block;margin-bottom:8px;color:#777b83;font-size:8px;font-weight:950;letter-spacing:.12em}.offerlab-equation strong{display:block;font-size:20px;line-height:1.16;letter-spacing:-.035em}.offerlab-plus{display:grid;place-items:center;width:38px;color:#c52621;font-size:26px;font-weight:400}.offerlab-all{display:grid;place-items:center;min-width:145px;margin:13px 0 13px 18px;background:#c52621;color:#fff;font-size:11px;font-weight:950;letter-spacing:.12em;text-align:center}.offerlab-all b{display:block;color:#ffd84d;font-size:26px;line-height:1;letter-spacing:-.045em;margin-bottom:5px}
      .offerlab-final{display:flex;align-items:center;justify-content:space-between;gap:28px;padding-top:34px}.offerlab-final p{margin:0;color:#555a62;font-size:13px;line-height:1.65}.offerlab-final p strong{color:#111318}.offerlab-cta{display:inline-flex;align-items:center;gap:18px;border-radius:999px;padding:15px 22px;background:#111318;color:#fff;font-size:12px;font-weight:950;transition:.2s}.offerlab-cta:hover{background:#c52621;transform:translateY(-2px)}

      @media(max-width:1040px){.offerlab-proof-strip{grid-template-columns:1fr 1fr}.offerlab-proof-strip>div:nth-child(2){border-right:0}.offerlab-proof-strip>div:nth-child(-n+2){border-bottom:1px solid #d0cbc3}.offerlab-head{grid-template-columns:1fr;gap:22px}.offerlab-light{grid-template-columns:1fr}.offerlab-lite+.offerlab-lite{border-left:0;border-top:1px solid #aaa69f;padding-left:0}.offerlab-forge-grid{grid-template-columns:1fr;gap:52px}.forge-preview{min-height:320px}.offerlab-equation{grid-template-columns:1fr}.offerlab-equation article{padding:22px 0;border-bottom:1px solid #d0cbc3}.offerlab-plus{display:none}.offerlab-all{min-height:84px;margin:20px 0 0}.offerlab-total-top{align-items:flex-start;flex-direction:column}}
      @media(max-width:640px){.offerlab-proof-strip{grid-template-columns:1fr 1fr;margin-top:0}.offerlab-proof-strip>div{padding:16px 14px}.offerlab-proof-strip strong{font-size:17px}.offerlab-section{padding-top:88px}.offerlab-head{margin-bottom:48px}.offerlab-head h2{font-size:43px}.offerlab-light{margin-bottom:48px}.offerlab-lite{grid-template-columns:74px 1fr;min-height:0;padding:28px 0}.offerlab-lite-no{font-size:48px}.offerlab-lite-copy h3{font-size:28px}.offerlab-forge{margin:0 calc(var(--pad) * -1);padding:66px var(--pad) 68px}.forge-copy-block h3{font-size:50px}.forge-promise{grid-template-columns:1fr}.forge-preview{grid-template-columns:1fr;min-height:0;padding:20px}.forge-art{min-height:180px}.offerlab-total{padding:60px 0 74px}.offerlab-total-top h3{font-size:42px}.offerlab-final{align-items:flex-start;flex-direction:column}.offerlab-cta{width:100%;justify-content:space-between;box-sizing:border-box}}
      `;
      d.head.appendChild(style);

      const section=d.createElement('section');
      section.className='offerlab-section';
      section.id='offerlab-benefits';
      section.innerHTML=`<div class="container offerlab-inner">
        <div class="offerlab-head">
          <div><p class="offerlab-kicker">PROOF FIRST · BENEFITS INCLUDED</p><h2>잘 만드는 건 기본입니다.<br><em>계약은 더 안전하게,</em> 가치는 더 길게.</h2></div>
          <p>실력은 실제 프로젝트에서 먼저 확인하세요. 그다음 계약 부담과 운영 위험을 줄이고, 오픈 후에도 아이디어 실험이 이어지게 설계했습니다.</p>
        </div>

        <div class="offerlab-proof-strip" aria-label="구매 전 확인할 수 있는 신뢰 기준">
          <div><strong>21</strong><span>공개 프로젝트</span></div>
          <div><strong>REAL</strong><span>실제 화면·구현 범위 공개</span></div>
          <div><strong>SCOPE</strong><span>범위 확정 후 개발</span></div>
          <div><strong>NDA</strong><span>비밀유지 계약</span></div>
        </div>

        <div class="offerlab-light">
          <article class="offerlab-lite">
            <div class="offerlab-lite-no">01</div>
            <div class="offerlab-lite-copy"><small>FLEXIBLE PAYMENT</small><h3>프로젝트 비용<br>단계별 분할납부</h3><p>진행 결과를 확인하면서 다음 단계로 넘어갑니다. 프로젝트 비용도 그 흐름에 맞춰 나눕니다.</p><div class="offerlab-mini-track"><i></i>착수<b></b><i></i>중간<b></b><i></i>검수<b></b><i></i>오픈</div></div>
          </article>
          <article class="offerlab-lite">
            <div class="offerlab-lite-no">02</div>
            <div class="offerlab-lite-copy"><small>3 MONTH CARE</small><h3>오픈 후 3개월<br>운영 안정화 지원</h3><p>서비스가 실제 운영에 자리 잡는 초기 3개월 동안, 납품 범위에서 확인되는 오류와 업데이트 이슈를 추가 비용 없이 바로잡습니다.</p><div class="offerlab-care-pill"><strong>3 MONTHS</strong><span>오류 대응 · 업데이트 이슈 · 초기 안정화</span></div></div>
          </article>
        </div>

        <div class="offerlab-forge">
          <div class="offerlab-forge-grid">
            <div class="forge-copy-block">
              <div class="forge-kicker">03 / EXCLUSIVE BENEFIT</div>
              <h3>AI IDEA FORGE<span>생각나는 순간 요청할 수 있는 24시간 아이디어 창구</span></h3>
              <p>“버튼을 옮기면?”, “색을 바꾸면?”, “메인 구성을 다르게 보면?” 생각나는 순간 전용 게시판에 남기세요. 운영 화면은 건드리지 않고 페이지 복사본에서 아이디어를 빠르게 시각화해 비교할 수 있게 합니다.</p>
              <div class="forge-promise"><div><strong>6 MONTHS</strong><span>PROJECT OPEN 이후 제공</span></div><div><strong>24 HOURS</strong><span>요청 접수 가능 · 납기 SLA 의미 아님</span></div></div>
              <div class="forge-idea-line">말로 설명하고 기다리는 대신, <em>먼저 보고 선택할 수 있는 화면</em>으로 만듭니다.</div>
            </div>
            <div class="forge-demo-wrap">
              <div class="forge-demo-note"><span>LIVE IDEA PREVIEW</span><b>TRY 4 DIRECTIONS</b></div>
              <div class="forge-controls">
                <input type="radio" name="forge" id="forge-original" checked>
                <input type="radio" name="forge" id="forge-warm">
                <input type="radio" name="forge" id="forge-focus">
                <input type="radio" name="forge" id="forge-compact">
                <div class="forge-labels"><label for="forge-original">원본</label><label for="forge-warm">분위기</label><label for="forge-focus">강조</label><label for="forge-compact">배치</label></div>
                <div class="forge-stage"><div class="forge-browser"><i></i><i></i><i></i><b>COPY PAGE / IDEA PREVIEW</b></div><div class="forge-preview"><div class="forge-screen-copy"><span>YOUR IDEA</span><strong>떠오른 생각을, 직접 보고 선택할 수 있는 화면으로.</strong><p></p><b>아이디어 실체화 →</b></div><div class="forge-art"></div></div></div>
              </div>
              <p class="forge-demo-caption">위 버튼을 눌러 같은 화면이 어떻게 달라지는지 바로 확인해보세요.</p>
            </div>
          </div>
        </div>

        <div class="offerlab-total">
          <div class="offerlab-total-top"><span>ONE PROJECT · ALL INCLUDED</span><h3>추가 옵션을 고르는 구조가 아닙니다.<br><em>기본 계약에 전부 포함합니다.</em></h3></div>
          <div class="offerlab-equation">
            <article><small>01 / START EASIER</small><strong>단계별<br>분할납부</strong></article><div class="offerlab-plus">+</div>
            <article><small>02 / STAY STABLE</small><strong>3개월<br>운영 안정화 지원</strong></article><div class="offerlab-plus">+</div>
            <article><small>03 / KEEP CREATING</small><strong>6개월 · 24시간<br>AI IDEA FORGE</strong></article>
            <div class="offerlab-all"><div><b>ALL</b>INCLUDED</div></div>
          </div>
          <div class="offerlab-final"><p><strong>실력은 실제 프로젝트로 확인하고, 계약 부담은 구조로 줄였습니다.</strong><br>제작 → 오픈 → 안정화 → 아이디어 실체화까지 한 흐름으로 이어집니다.</p><a class="offerlab-cta" href="#diagnosis">내 프로젝트 가능 여부 확인 <span>↗</span></a></div>
        </div>
      </div>`;

      const process=d.getElementById('process');
      if(!process) throw new Error('#process not found');
      process.insertAdjacentElement('afterend',section);

      // Conversion-lab ordering: proof first, then process, then risk/value stack.
      const diagnosis=d.getElementById('diagnosis');
      const partnership=d.getElementById('partnership');
      if(partnership) partnership.style.display='none';
      if(diagnosis) section.insertAdjacentElement('afterend',diagnosis);

      status.classList.add('is-hidden');
    }catch(err){
      status.textContent='Preview injection failed';
      console.error('[offer-lab]',err);
    }
  });
})();
</script>
</body>
</html>
