<script>
(async()=>{

    let html=await fetch('/?offer-lab-source=2',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('home fetch '+r.status);return r.text()});
    html=html.replace(/<head>/i,'<head>\n<base href="/">');
    html=html.replace(/<title>[\s\S]*?<\/title>/i,'<title>SuaveForge Offer Lab | 계약 혜택 테스트</title>');
    html=html.replace(/<meta[^>]+name=["']robots["'][^>]*>/i,'<meta name="robots" content="noindex,nofollow,noarchive">');

    html=html.replace(/<!--\s*SITEHUB-BEGIN\s*-->[\s\S]*?<!--\s*SITEHUB-END\s*-->/ig,'');

    html=html.replace(/href=["']#([^"']*)["']/g,(m,id)=>`href="/offer-lab/#${id}"`);
    const css=`<style id="offerlab-style">
.offerlab-section{position:relative;overflow:hidden;padding:124px 0 120px;background:#f5f2ec;border-top:1px solid #cfcac2;border-bottom:1px solid #cfcac2}.offerlab-section:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.32;background-image:linear-gradient(rgba(17,19,24,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(17,19,24,.045) 1px,transparent 1px);background-size:72px 72px;mask-image:linear-gradient(to bottom,transparent,black 18%,black 82%,transparent)}.offerlab-inner{position:relative;z-index:1}.offerlab-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.42fr);align-items:end;gap:72px;margin-bottom:62px}.offerlab-kicker{margin:0 0 20px;color:#c52621;font-size:11px;font-weight:950;letter-spacing:.17em;text-transform:uppercase}.offerlab-head h2{max-width:930px;margin:0;color:#111318;font-size:clamp(44px,5.2vw,76px);font-weight:950;line-height:1.04;letter-spacing:-.062em}.offerlab-head h2 em{position:relative;font-style:normal;z-index:0}.offerlab-head h2 em:after{content:"";position:absolute;z-index:-1;left:-.02em;right:-.06em;bottom:.05em;height:.24em;background:#ffd84d;transform:rotate(-1.2deg)}.offerlab-head>p{margin:0 0 6px;color:#666b75;font-size:15px;line-height:1.8}.offerlab-grid{display:grid;grid-template-columns:.82fr .82fr 1.36fr;border-top:1px solid #bdb8af;border-bottom:1px solid #bdb8af}.offerlab-card{position:relative;min-height:520px;padding:34px 30px 32px;border-right:1px solid #bdb8af;background:rgba(255,255,255,.14);transition:transform .22s ease,background .22s ease}.offerlab-card:last-child{border-right:0}.offerlab-card:hover{background:rgba(255,255,255,.5);transform:translateY(-5px)}.offerlab-no{display:flex;align-items:center;justify-content:space-between;margin-bottom:52px;color:#c52621;font-size:13px;font-weight:950;letter-spacing:.13em}.offerlab-no strong{font-size:48px;line-height:1;letter-spacing:-.06em}.offerlab-no span{color:#777b83;font-size:9px;letter-spacing:.14em}.offerlab-card h3{margin:0;color:#111318;font-size:clamp(28px,2.5vw,40px);line-height:1.08;letter-spacing:-.052em}.offerlab-card>p{margin:22px 0 0;color:#666b75;font-size:14px;line-height:1.75}.offerlab-points{display:grid;gap:10px;margin-top:34px;padding:0;list-style:none}.offerlab-points li{display:flex;align-items:flex-start;gap:10px;color:#3f434b;font-size:12px;font-weight:800;line-height:1.55}.offerlab-points li:before{content:"✓";display:grid;place-items:center;flex:0 0 20px;width:20px;height:20px;border-radius:50%;background:#c52621;color:white;font-size:11px}.offerlab-timeline{display:grid;grid-template-columns:repeat(4,1fr);margin-top:46px;border-top:1px solid #c9c4bc}.offerlab-timeline span{position:relative;padding-top:18px;color:#686c74;font-size:10px;font-weight:900}.offerlab-timeline span:before{content:"";position:absolute;top:-4px;left:0;width:8px;height:8px;border-radius:50%;background:#c52621}.offerlab-maintain{margin-top:46px;border:1px solid #c9c4bc;padding:20px;background:#fff}.offerlab-maintain b{display:block;margin-bottom:9px;font-size:13px}.offerlab-maintain small{display:block;color:#6c7078;font-size:11px;line-height:1.6}.offerlab-feature{background:#111318;color:#fff}.offerlab-feature:hover{background:#171a20}.offerlab-feature .offerlab-no span{color:#9297a2}.offerlab-feature .offerlab-no{color:#ff6c66}.offerlab-feature h3{color:#fff}.offerlab-feature>p{color:#b4b8c1}.forge-badge{display:inline-flex;margin:0 0 16px;padding:7px 10px;border:1px solid rgba(255,255,255,.22);color:#ffd84d;font-size:9px;font-weight:950;letter-spacing:.12em;text-transform:uppercase}.forge-controls{margin-top:26px}.forge-controls input{position:absolute;opacity:0;pointer-events:none}.forge-labels{display:flex;flex-wrap:wrap;gap:7px}.forge-labels label{cursor:pointer;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 10px;color:#b9bdc5;font-size:10px;font-weight:900;transition:.2s}.forge-labels label:hover{border-color:#fff;color:#fff}#forge-original:checked~.forge-labels label[for=forge-original],#forge-warm:checked~.forge-labels label[for=forge-warm],#forge-focus:checked~.forge-labels label[for=forge-focus],#forge-compact:checked~.forge-labels label[for=forge-compact]{background:#c52621;border-color:#c52621;color:#fff}.forge-stage{margin-top:18px;border:1px solid rgba(255,255,255,.22);background:#f7f4ee;color:#111318;box-shadow:0 22px 50px rgba(0,0,0,.22);transition:.3s}.forge-browser{display:flex;align-items:center;gap:6px;height:27px;padding:0 10px;border-bottom:1px solid #d9d4cb;background:#ebe7df}.forge-browser i{width:6px;height:6px;border-radius:50%;background:#aaa}.forge-browser b{margin-left:auto;color:#777;font-size:8px;letter-spacing:.08em}.forge-preview{display:grid;grid-template-columns:1.05fr .95fr;min-height:190px;padding:18px;gap:16px;transition:.3s}.forge-copy{align-self:center}.forge-copy span{display:block;margin-bottom:8px;color:#c52621;font-size:8px;font-weight:950;letter-spacing:.13em}.forge-copy strong{display:block;max-width:210px;font-size:24px;line-height:1.02;letter-spacing:-.055em}.forge-copy p{width:78%;height:5px;margin:16px 0 0;background:#c8c4bc;box-shadow:0 10px 0 #ddd8d0,0 20px 0 #ddd8d0}.forge-art{min-height:150px;background:linear-gradient(140deg,#22252b 0 46%,#c52621 46% 50%,#d8d2c8 50%);transition:.3s}.forge-cta{display:inline-block;margin-top:35px;padding:8px 11px;background:#111318;color:#fff;font-size:8px;font-weight:950}#forge-warm:checked~.forge-stage .forge-preview{background:#f3e6d6}#forge-warm:checked~.forge-stage .forge-art{background:linear-gradient(135deg,#6f2c22,#e0a55d 55%,#f3dfb7)}#forge-focus:checked~.forge-stage .forge-preview{grid-template-columns:.78fr 1.22fr}#forge-focus:checked~.forge-stage .forge-art{background:linear-gradient(145deg,#111318 0 52%,#ffd84d 52% 57%,#c52621 57%)}#forge-focus:checked~.forge-stage .forge-copy strong{font-size:20px}#forge-compact:checked~.forge-stage .forge-preview{grid-template-columns:1fr;min-height:190px}#forge-compact:checked~.forge-stage .forge-art{min-height:80px;order:-1;background:linear-gradient(90deg,#111318,#454b56)}#forge-compact:checked~.forge-stage .forge-copy{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}#forge-compact:checked~.forge-stage .forge-copy p{display:none}#forge-compact:checked~.forge-stage .forge-cta{margin-top:0;justify-self:end}.offerlab-foot{display:flex;align-items:center;justify-content:space-between;gap:30px;padding-top:34px}.offerlab-foot p{margin:0;color:#555a62;font-size:14px}.offerlab-foot p strong{color:#111318}.offerlab-cta{display:inline-flex;align-items:center;gap:18px;border-radius:999px;padding:15px 22px;background:#c52621;color:#fff;font-size:12px;font-weight:950;transition:.2s}.offerlab-cta:hover{background:#111318;transform:translateY(-2px)}.offerlab-testnote{position:absolute;top:22px;right:var(--pad);z-index:2;color:#8a8e96;font-size:8px;font-weight:950;letter-spacing:.14em;text-transform:uppercase}@media(max-width:980px){.offerlab-section{padding:96px 0}.offerlab-head{grid-template-columns:1fr;gap:22px}.offerlab-grid{grid-template-columns:1fr}.offerlab-card{min-height:0;border-right:0;border-bottom:1px solid #bdb8af}.offerlab-card:last-child{border-bottom:0}.offerlab-feature{min-height:620px}.offerlab-no{margin-bottom:30px}}@media(max-width:640px){.offerlab-section{padding:78px 0}.offerlab-head h2{font-size:42px}.offerlab-card{padding:28px 22px}.offerlab-feature{min-height:0}.forge-preview{grid-template-columns:1fr}.forge-art{min-height:120px}.offerlab-foot{align-items:flex-start;flex-direction:column}.offerlab-testnote{display:none}}</style>`;
    html=html.replace('</head>',css+'</head>');
    const offer=`<section class="offerlab-section" id="offer-lab"><span class="offerlab-testnote">COPY PREVIEW · MAIN UNCHANGED</span><div class="container offerlab-inner"><div class="offerlab-head"><div><p class="offerlab-kicker">PROJECT BENEFITS</p><h2>부담은 나누고,<br><em>아이디어는 더 빠르게</em> 화면이 됩니다.</h2></div><p>프로젝트 비용은 진행 단계에 맞춰 나누고, 오픈 이후에는 안정적인 유지보수와 아이디어 실체화 도구까지 이어집니다.</p></div><div class="offerlab-grid"><article class="offerlab-card"><div class="offerlab-no"><strong>01</strong><span>FLEXIBLE PAYMENT</span></div><h3>프로젝트 비용<br>단계별 분할납부</h3><p>한 번에 큰 비용을 부담하기보다, 실제 진행 단계와 결과를 확인하면서 프로젝트 비용을 나눠 납부합니다.</p><div class="offerlab-timeline"><span>착수</span><span>중간</span><span>검수</span><span>오픈</span></div><ul class="offerlab-points"><li>프로젝트 규모에 맞춘 납부 구간</li><li>진행 결과를 확인하며 다음 단계로</li><li>초기 비용 부담을 분산</li></ul></article><article class="offerlab-card"><div class="offerlab-no"><strong>02</strong><span>3 MONTH CARE</span></div><h3>오픈 후 3개월<br>무료 유지보수</h3><p>서비스가 실제 운영에 자리 잡는 초기 3개월 동안, 납품 범위의 오류와 업데이트 문제를 추가 비용 없이 바로잡습니다.</p><div class="offerlab-maintain"><b>OPEN → STABILIZE</b><small>오류 대응 · 업데이트 이슈 · 초기 운영 안정화</small></div><ul class="offerlab-points"><li>오픈 이후 실제 운영 기준 대응</li><li>초기 안정화 기간 무상 지원</li><li>다시 개발자를 찾는 시간 절감</li></ul></article><article class="offerlab-card offerlab-feature"><div class="offerlab-no"><strong>03</strong><span>IDEA → SCREEN</span></div><div class="forge-badge">6 MONTHS · 24H · INCLUDED</div><h3>AI IDEA FORGE</h3><p>아이디어가 떠오르는 순간 전용 게시판에 남기세요. AI가 페이지 복사본에서 색상, 배치, 문구, 크기와 화면 구성을 새로운 시안으로 빠르게 실체화합니다.</p><div class="forge-controls"><input type="radio" name="forge" id="forge-original" checked><input type="radio" name="forge" id="forge-warm"><input type="radio" name="forge" id="forge-focus"><input type="radio" name="forge" id="forge-compact"><div class="forge-labels"><label for="forge-original">원본</label><label for="forge-warm">분위기</label><label for="forge-focus">강조</label><label for="forge-compact">배치</label></div><div class="forge-stage"><div class="forge-browser"><i></i><i></i><i></i><b>AI IDEA FORGE · COPY</b></div><div class="forge-preview"><div class="forge-copy"><span>IDEA → SCREEN</span><strong>생각한 순간,<br>화면으로 확인.</strong><p></p><b class="forge-cta">새 시안 확인 →</b></div><div class="forge-art"></div></div></div></div></article></div><div class="offerlab-foot"><p>아이디어를 말로만 남기지 않고, <strong>직접 보고 선택할 수 있는 화면으로.</strong></p><a class="offerlab-cta" href="#contact">프로젝트 문의 <span>→</span></a></div></div></section>`;
    const marker='<section class="partnership" id="partnership">';
    if(!html.includes(marker)) throw new Error('partnership marker not found');
    html=html.replace(marker,offer+'\n'+marker);
    document.open();document.write(html);document.close();
  }catch(err){document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:40px;background:#f5f2ec;color:#111318;font-family:system-ui"><div><b>Offer Lab load failed</b><p style="color:#666">'+String(err.message||err)+'</p><a href="/" style="color:#c52621">메인으로 돌아가기</a></div></div>'}
})();
</script>
