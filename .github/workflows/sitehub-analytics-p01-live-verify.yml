name: Verify live SuaveForge SiteHub analytics p01

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sitehub-analytics-p01-live-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect live markers
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=$(curl -fsS --max-time 12 'https://suaveforge.com/?sitehub_probe=20260917' || true)
          WORK=$(curl -fsS --max-time 12 'https://suaveforge.com/work/idhair/?sitehub_probe=20260917' || true)
          LOADER=$(curl -fsS --max-time 12 'https://sitehub.suaveforge.com/analytics-loader.js' || true)
          echo "ROOT_BYTES=${#ROOT}"
          echo "WORK_BYTES=${#WORK}"
          echo "LOADER_BYTES=${#LOADER}"
          grep -Fq 'data-sitehub-project="p01"' <<<"$ROOT" && echo ROOT_LOADER=PASS || echo ROOT_LOADER=FAIL
          grep -Fq 'https://sitehub.suaveforge.com' <<<"$ROOT" && echo ROOT_CSP_SCRIPT=PASS || echo ROOT_CSP_SCRIPT=FAIL
          grep -Fq 'https://api-sitehub.suaveforge.com:18464' <<<"$ROOT" && echo ROOT_CSP_CONNECT=PASS || echo ROOT_CSP_CONNECT=FAIL
          grep -Fq 'data-sitehub-project="p01"' <<<"$WORK" && echo WORK_LOADER=PASS || echo WORK_LOADER=FAIL
          grep -Fq 'SITEHUB_ANALYTICS' <<<"$LOADER" && echo LOADER_RUNTIME=PASS || echo LOADER_RUNTIME=FAIL
          echo ROOT_TITLE=$(sed -n 's:.*<title>\(.*\)</title>.*:\1:p' <<<"$ROOT" | head -1)
