name: Verify live SuaveForge SiteHub analytics p01

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sitehub-analytics-p01-live-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify live markers strictly
        shell: bash
        run: |
          set -Eeuo pipefail
          OK=0
          for i in $(seq 1 48); do
            Q="sitehub_probe=${GITHUB_RUN_ID}_${i}"
            ROOT=$(curl -fsS --max-time 12 "https://suaveforge.com/?$Q" || true)
            WORK=$(curl -fsS --max-time 12 "https://suaveforge.com/work/idhair/?$Q" || true)
            LOADER=$(curl -fsS --max-time 12 "https://sitehub.suaveforge.com/analytics-loader.js?$Q" || true)
            R1=0; R2=0; R3=0; R4=0; R5=0
            grep -Fq 'data-sitehub-project="p01"' <<<"$ROOT" && R1=1 || true
            grep -Fq 'script-src' <<<"$ROOT" && grep -Fq 'https://sitehub.suaveforge.com' <<<"$ROOT" && R2=1 || true
            grep -Fq 'connect-src' <<<"$ROOT" && grep -Fq 'https://api-sitehub.suaveforge.com:18464' <<<"$ROOT" && R3=1 || true
            grep -Fq 'data-sitehub-project="p01"' <<<"$WORK" && R4=1 || true
            grep -Fq 'SITEHUB_ANALYTICS' <<<"$LOADER" && R5=1 || true
            echo "TRY=$i ROOT_LOADER=$R1 CSP_SCRIPT=$R2 CSP_CONNECT=$R3 WORK_LOADER=$R4 LOADER_RUNTIME=$R5"
            if [ "$R1$R2$R3$R4$R5" = 11111 ]; then OK=1; break; fi
            sleep 5
          done
          test "$OK" = 1
          echo 'SUAVEFORGE_SITEHUB_ANALYTICS_LIVE=PASS'
