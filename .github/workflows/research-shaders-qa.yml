name: Research Shader VFX Real GPU QA
on:
  push:
    branches: [main]
    paths:
      - "research/interactive/shaders/**"
      - ".github/workflows/research-shaders-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-shader-vfx-qa
  cancel-in-progress: true
jobs:
  webgl-shader-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify original GPU shader source and navigation
        run: |
          node --check research/interactive/shaders/effects.js
          node --check research/interactive/shaders/lab.js
          node --check research/interactive/shaders/qa.cjs
          test -s research/interactive/shaders/shaders.css
          test -s research/interactive/shaders/index.html
          test -s research/interactive/shaders/README.md
          grep -q 'href="/research/interactive/shaders/"' index.html
          grep -q 'href="/research/interactive/shaders/"' research/index.html
          grep -q 'href="/research/interactive/shaders/"' research/interactive/index.html
      - name: Install Chromium for real GPU software rendering
        working-directory: research/interactive/shaders
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Serve unchanged public website snapshot
        run: |
          python3 -m http.server 8181 --bind 127.0.0.1 >/tmp/suaveforge-shader-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8181/research/interactive/shaders/ -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/suaveforge-shader-http.log
          exit 1
      - name: Verify 16 real GLSL GPU programs, filters, comparison and mobile
        run: node research/interactive/shaders/qa.cjs
      - name: Upload screenshots, compilation report and mobile QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-shader-vfx-qa-${{ github.run_id }}
          path: research/interactive/shaders/qa-artifacts/
          retention-days: 7
          if-no-files-found: warn
