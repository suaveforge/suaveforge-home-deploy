name: Interactive Research Real WebGL QA
on:
  push:
    branches: [main]
    paths:
      - "research/interactive/**"
      - "research/index.html"
      - "research/charts/index.html"
      - "index.html"
      - ".github/workflows/research-interactive-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-interactive-qa
  cancel-in-progress: true
jobs:
  real-browser-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Source syntax and navigation checks
        run: |
          node --check research/interactive/catalog.js
          node --input-type=module --check < research/interactive/spatial-lab.js
          node --check research/interactive/qa/qa.cjs
          test -s research/interactive/index.html
          test -s research/interactive/interactive.css
          grep -q 'href="/research/interactive/"' index.html
          grep -q 'href="/research/interactive/"' research/index.html
      - name: Install Chromium
        working-directory: research/interactive/qa
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Host unchanged static website
        run: |
          python3 -m http.server 8181 --bind 127.0.0.1 >/tmp/suaveforge-interactive-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8181/research/interactive/ -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/suaveforge-interactive-http.log
          exit 1
      - name: Verify real building and modular-device interactions on desktop and mobile
        run: node research/interactive/qa/qa.cjs
      - name: Upload actual Chromium screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-webgl-qa-${{ github.run_id }}
          path: research/interactive/qa/artifacts/
          if-no-files-found: warn
          retention-days: 7
