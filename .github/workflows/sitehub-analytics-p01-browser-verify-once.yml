name: Verify SuaveForge p01 SiteHub analytics in browser once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sitehub-analytics-p01-browser-verify-once.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real browser pageview delivery
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-browser && cd /tmp/p01-browser
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core@1.55.0
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          CHROME="$CHROME" node <<'NODE'
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const hits=[];
            page.on('response',r=>{if(r.url().includes('api-sitehub.suaveforge.com:18464/api/v1/analytics/events'))hits.push({url:r.url(),status:r.status()})});
            const consoleErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            await page.goto(`https://suaveforge.com/?sitehub_browser=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(5000);
            const root=await page.evaluate(()=>({analytics:window.SITEHUB_ANALYTICS||null,pending:JSON.parse(localStorage.getItem('sitehub:p01:pending_pageviews_v1')||'[]').length,acks:JSON.parse(localStorage.getItem('sitehub:p01:pageview_acks_v1')||'[]').length}));
            await page.goto(`https://suaveforge.com/work/idhair/?sitehub_browser=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(5000);
            const work=await page.evaluate(()=>({analytics:window.SITEHUB_ANALYTICS||null,pending:JSON.parse(localStorage.getItem('sitehub:p01:pending_pageviews_v1')||'[]').length,acks:JSON.parse(localStorage.getItem('sitehub:p01:pageview_acks_v1')||'[]').length}));
            await browser.close();
            console.log('ROOT_ACTIVE='+Boolean(root.analytics?.active));
            console.log('ROOT_PROJECT='+String(root.analytics?.projectId||''));
            console.log('ROOT_PENDING='+root.pending);
            console.log('ROOT_ACKS='+root.acks);
            console.log('WORK_ACTIVE='+Boolean(work.analytics?.active));
            console.log('WORK_PROJECT='+String(work.analytics?.projectId||''));
            console.log('WORK_PENDING='+work.pending);
            console.log('WORK_ACKS='+work.acks);
            console.log('ANALYTICS_RESPONSES='+JSON.stringify(hits));
            console.log('CONSOLE_ERRORS='+JSON.stringify(consoleErrors.filter(x=>x.includes('sitehub')||x.includes('Content Security Policy'))));
            if(!root.analytics?.active||root.analytics.projectId!=='p01')throw new Error('root SiteHub analytics inactive');
            if(!work.analytics?.active||work.analytics.projectId!=='p01')throw new Error('work SiteHub analytics inactive');
            if(hits.filter(x=>x.status>=200&&x.status<300).length<2)throw new Error('expected two successful analytics responses');
            if(root.pending!==0||work.pending!==0)throw new Error('analytics queue did not flush');
            if(work.acks<2)throw new Error('expected acknowledged root and work pageviews');
            console.log('SUAVEFORGE_P01_BROWSER_ANALYTICS=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
