<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">

  <title>LMS 운영비·유지보수·라이선스 제안 | SuaveForge</title>
  <style>
    @font-face {
      font-family: "Proposal Pretendard";
      src: url("Pretendard-Regular.otf") format("opentype");
      font-style: normal;
      font-weight: 400;
      font-display: block;
    }

    @font-face {
      font-family: "Proposal Pretendard";
      src: url("Pretendard-Bold.otf") format("opentype");
      font-style: normal;
      font-weight: 700;
      font-display: block;
    }

    :root {
      color-scheme: light;
      --ink: #171a21;
      --muted: #626873;
      --line: #d8d8d4;
      --paper: #fff;
      --canvas: #ecece8;
      --accent: #cf2e2a;
    }

    * { box-sizing: border-box; }

    html { background: var(--canvas); }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
      letter-spacing: 0;
    }

    .viewer-header {
      position: sticky;
      z-index: 10;
      top: 0;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .96);
    }

    .viewer-header-inner {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      width: min(1180px, calc(100% - 40px));
      min-height: 68px;
      margin: 0 auto;
      gap: 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      color: var(--ink);
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    .brand img {
      display: block;
      width: 30px;
      height: 30px;
      margin-right: 9px;
      border-radius: 6px;
      background: #171a21;
    }

    .document-title {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .actions a,
    .actions button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 750;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }

    .actions a:first-child,
    .actions button {
      border-color: var(--accent);
      color: #fff;
      background: var(--accent);
    }

    [hidden] { display: none !important; }

    .pages {
      width: min(980px, calc(100% - 40px));
      margin: 34px auto 56px;
    }

    .document-page {
      position: relative;
      margin: 0 0 24px;
    }

    .page {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #d3d3cf;
      background: var(--paper);
      box-shadow: 0 12px 32px rgba(23, 26, 33, .10);
    }

    .fee-overlay,
    .cost-highlight {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .viewer-footer {
      padding: 0 20px 38px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 720px) {
      .viewer-header-inner {
        grid-template-columns: minmax(0, 1fr) auto;
        width: min(100% - 24px, 1180px);
        min-height: 60px;
        gap: 10px;
      }

      .brand span { display: none; }
      .brand img { margin-right: 0; }
      .document-title { display: none; }

      .actions a,
      .actions button {
        min-height: 36px;
        padding: 0 10px;
        font-size: 12px;
      }

      .pages {
        width: 100%;
        margin: 12px auto 30px;
      }

      .document-page {
        margin-bottom: 12px;
      }

      .page {
        border-right: 0;
        border-left: 0;
        box-shadow: none;
      }
    }

    @media print {
      .viewer-header, .viewer-footer { display: none; }
      .pages { width: 100%; margin: 0; }
      .document-page { margin: 0; break-after: page; }
      .page { border: 0; box-shadow: none; }
    }
  </style>
<script async src="https://sitehub.suaveforge.com/analytics-loader.js" data-sitehub-project="p01"></script></head>
<body>
  <header class="viewer-header">
    <div class="viewer-header-inner">
      <a class="brand" href="../" aria-label="SuaveForge 홈페이지">
        <img src="../assets/favicon/favicon.svg" alt="">

      </a>
      <h1 class="document-title">LMS 운영비·유지보수·라이선스 제안</h1>

      <img class="page" src="page-1.png" alt="" width="1309" height="1852" fetchpriority="high">
      <svg class="fee-overlay" viewBox="0 0 1309 1852" role="img" aria-label="월 유지보수 비용 40만원" hidden>
        <rect x="102" y="340" width="1100" height="72" fill="#fff" />
        <text x="106.26" y="369" fill="#29313d" font-family="Proposal Pretendard" font-size="23.1" font-weight="400" letter-spacing="0">
          <tspan x="106.26" y="369">이후 유지보수 비용은 월 <tspan data-fee>40</tspan>만원 이고 1년 단위 결제도 가능 합니다. 비용 안에 서버·DB 상태 확인, 장애 대응, 보안 업데이</tspan>

        <text x="760" y="1198" fill="#cf2e2a" font-family="Proposal Pretendard" font-size="24" font-weight="700">→</text>

        <text x="808" y="1173" fill="#6e747d" font-family="Proposal Pretendard" font-size="15" font-weight="400">성장 운영</text>

      </svg>
    </section>
  </main>

  <footer class="viewer-footer">© 2026 SuaveForge</footer>
  <script>
    (() => {
      const defaultFee = 40;
      const rawFee = new URLSearchParams(window.location.search).get("fee");
      const normalizedFee = rawFee ? rawFee.replaceAll(",", "").trim() : "";
      const parsedFee = Number(normalizedFee);
      const fee = Number.isInteger(parsedFee) && parsedFee >= 1 && parsedFee <= 999
        ? parsedFee
        : defaultFee;
      const isCustomFee = rawFee !== null && fee !== defaultFee;
      const formattedFee = fee.toLocaleString("ko-KR");

      document.querySelector("[data-fee]").textContent = formattedFee;
      const feeOverlay = document.querySelector(".fee-overlay");
      feeOverlay.setAttribute("aria-label", `월 유지보수 비용 ${formattedFee}만원`);

      if (isCustomFee) {
        feeOverlay.removeAttribute("hidden");
        document.querySelectorAll(".original-action").forEach((action) => {
          action.hidden = true;
        });

        const printAction = document.querySelector(".custom-action");
        printAction.hidden = false;
        printAction.addEventListener("click", () => window.print());
      }
    })();
  </script>
